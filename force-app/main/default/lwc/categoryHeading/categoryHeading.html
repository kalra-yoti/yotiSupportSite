<template>
  <template if:false={isMobileNavigation}>
    <div class="category-landing">
      
        <div class="div-wrapper">
          <div class="div-4">
            <div class="breadcrumb">
              <div class="div-2">
               <div class="div">
                  <div class="page-link-label" onclick={handleRedirect}> <a style="color:#27619B" href={pageLink}>{type}</a></div>
                  <img  class="solid-chevron" src={rightIconT} />
                </div>
                
              </div>
              <div class="page-link-label-2">{product}</div>
            </div>
            <div class="div-5">
              <div class="rectangle" > 
                <img  style="width: 32px;height: 32px; margin: 15px 15px 15px 15px;" src={image} />
              </div>
              
              <div class="category font">{product}</div>
            </div>
          </div>
        </div>

    </div>    
  </template>
</template>
