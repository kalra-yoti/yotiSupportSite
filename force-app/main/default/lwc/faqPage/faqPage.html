<template>

    <div class="div-wrapper">
        <div class="div">
          <div class="page-link-label" onclick={handleType}>{type}</div>
          <img class="solid-chevron" src={rightIconT} />
          <div class="page-link-label" onclick={handleProduct} >{product}</div>
          <img class="solid-chevron" src={rightIconT} />
          <div class="text-wrapper">{category}</div>
        </div>
        <div class="div-2">
          <div class="div-3">
            <div class="div-4">
              <div class="title"></div>
              <div class="flexcontainer">
                
              </div>
            </div>
            <div class="div-5">
              <div class="chip">
                <div class="text"><img class="icon" src={businessSupport} alt="Business Icon"/> {type}</div>
              </div>
              <div class="chip"><div class="text">{product}</div></div>
              <div class="chip"><div class="text">Updated on {formattedDate}</div></div>
            </div>
          </div>
          <div class="div-6">
            <div class="div-7">
              <div class="text-wrapper-2">Related articles</div>
              <template for:each={relatedData} for:item="item1">
                <p onclick={handleClick} key={item1.Id} data-id={item1.Id} class="text-wrapper-3">{item1.Title}</p>
              </template>  
             
            </div>
          </div>
        </div>
      </div>
    
</template>
